[package]
name = "fineretouch-desktop"
version = "0.4.0"
description = "FineRetouch offline desktop app: Tauri shell around the static web editor and the local AI engine sidecar"
authors = ["FineRetouch"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "fineretouch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
