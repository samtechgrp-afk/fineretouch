name: Desktop installers

# Builds the offline FineRetouch desktop app for Windows, macOS and Linux.
#
# PyInstaller cannot cross-compile, so every runner freezes its own native
# fineretouch-engine sidecar (scripts/package_desktop.py) and stages the ~87 MB model
# pack before tauri-action runs `tauri build`. Builds are unsigned: see
# docs/BUILD_DESKTOP_INSTALLERS.md for opening them past SmartScreen / Gatekeeper.
#
# Runs on demand (Actions -> Desktop installers -> Run workflow), on pull requests that
# touch the desktop shell or packaging, and on v* tags (which also attach the installers
# to a draft GitHub release).
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'scripts/package_desktop.py'
      - 'services/ai/desktop_entry.py'
      - 'services/ai/app/desktop.py'
      - 'services/ai/requirements.txt'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # draft release on v* tags

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            artifact: FineRetouch-Windows-Installer
          - label: macOS Apple Silicon
            os: macos-latest
            artifact: FineRetouch-macOS-Installer
          - label: macOS Intel
            os: macos-15-intel
            artifact: FineRetouch-macOS-Intel-Installer
          - label: Linux x64
            os: ubuntu-22.04
            artifact: FineRetouch-Linux-Installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf libegl1 libgles2

      - name: Install Node dependencies
        run: npm ci

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      # uv resolves fast, and --only-binary makes it pick releases that ship a wheel for this
      # runner. macOS Intel needs that: newer rawpy and sentencepiece have no x86_64 macOS
      # wheels, and building them from source stalled the job.
      - name: Install Python dependencies
        run: uv pip install --system --python python --only-binary ':all:' -r services/ai/requirements.txt pyinstaller

      - name: Freeze engine sidecar and stage model pack
        run: python scripts/package_desktop.py

      - name: Build installer (tauri build)
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          # DMG creation scripts Finder and can time out on a busy runner; one retry.
          retryAttempts: 1
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('FineRetouch {0}', github.ref_name) || '' }}
          releaseDraft: true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          compression-level: 0 # installers are already compressed
          retention-days: 30
