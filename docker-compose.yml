# Local full stack: web + AI service + batch worker + Postgres (pgvector) + Redis + S3 (SeaweedFS).
#   docker compose up --build
# Web: http://localhost:3000   AI: http://localhost:8000/docs   S3: http://localhost:8333
name: fineretouch

x-s3: &s3
  S3_ENDPOINT: http://s3:8333
  S3_REGION: us-east-1
  S3_BUCKET: fineretouch
  S3_ACCESS_KEY: fineretouch
  S3_SECRET_KEY: fineretouch-dev-secret

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: fineretouch
      POSTGRES_PASSWORD: fineretouch
      POSTGRES_DB: fineretouch
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fineretouch"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # S3-compatible object storage for local dev (SeaweedFS, Apache-2.0).
  # Production uses AWS S3 or Cloudflare R2 with the same S3_* variables.
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=1024"]
    volumes:
      - s3data:/data
      - ./infra/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["8333:8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 5s
      retries: 30

  ai:
    build: ./services/ai
    environment:
      <<: *s3
      CORS_ORIGINS: http://localhost:3000
      WEB_CONCURRENCY: 2
    ports: ["8000:8000"]
    depends_on:
      s3: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      <<: *s3
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
      RENDER_CONCURRENCY: 4
    depends_on:
      redis: { condition: service_healthy }
      ai: { condition: service_healthy }
    deploy:
      replicas: 1   # scale render throughput: docker compose up --scale worker=4

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_AI_URL: http://localhost:8000
    environment:
      <<: *s3
      S3_PUBLIC_ENDPOINT: http://localhost:8333
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://fineretouch:fineretouch@postgres:5432/fineretouch
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  s3data:
